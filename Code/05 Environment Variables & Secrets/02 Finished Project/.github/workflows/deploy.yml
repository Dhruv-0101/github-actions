# The name of the workflow as it appears in the Actions tab of the GitHub repository
name: Deployment

# Defines trigger events for the workflow.
# Automatically runs when code is pushed to either the 'main' or 'dev' branch.
on:
  push:
    branches:
      - main
      - dev

# 1. Global Environment Variables (Workflow scope)
# Available to all jobs and all steps within this workflow.
env:
  MONGODB_DB_NAME: gha-demo

jobs:
  # Job 1: Responsible for testing the server and application logic
  test:
    # Associates this job with a GitHub Environment named 'testing'.
    # This allows the job to load environment-specific secrets and apply deployment protection rules.
    environment: testing
    # Runs this job on a hosted Ubuntu virtual machine
    runs-on: ubuntu-latest

    # 2. Job-level Environment Variables (Job scope)
    # Available to all steps within the 'test' job, but NOT accessible by other jobs (e.g., 'deploy').
    env:
      MONGODB_CLUSTER_ADDRESS: cluster0.ntrwp.mongodb.net
      # Fetches encrypted credentials stored in GitHub Repository/Environment Secrets.
      # GitHub automatically masks these secrets (replaces them with '***') in the console logs.
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      PORT: 8080

    steps:
      # Step 1: Checks out the codebase to this runner VM
      - name: Get Code
        uses: actions/checkout@v3

      # Step 2: Caches dependencies to speed up the install step
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}

      # Step 3: Installs the project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Starts the server in the background ('&') and waits for the HTTP endpoint to become active.
      # Note: The database connection requires MongoDB Atlas to allow connections from the runner's dynamic IP address.
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT

      # Step 5: Runs the test suite
      - name: Run tests
        run: npm test

      # Step 6: Outputs the MONGODB_USERNAME environment variable to the console logs.
      # Because this is a secret, GitHub will print '***' to mask its value.
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"

  # Job 2: Simulates the deployment of the application
  deploy:
    # Requires the 'test' job to complete successfully first
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Step 1: Demonstrates variable scopes
      - name: Output information
        # 3. Step-level Environment Variables (Step scope)
        # ONLY available within this single step.
        env:
          PORT: 3000
        run: |
          # Accesses the global variable 'MONGODB_DB_NAME'
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME"
          # Attempting to print 'MONGODB_USERNAME' here will output nothing,
          # because it was scoped only to the 'test' job.
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          # Accessing step-level environment variable using GitHub Context syntax: ${{ env.PORT }}
          echo "${{ env.PORT }}"

# 1. क्या deploy job को test job के variables का access मिलेगा?
# नहीं, बिल्कुल नहीं मिलेगा।

# कारण: test job और deploy job दो बिल्कुल अलग-अलग Virtual Machines (कंप्यूटर्स) पर चलते हैं।
# जब test job खत्म होता है, तो उसका कंप्यूटर पूरी तरह से डिलीट (destroy) हो जाता है। इसलिए test job के अंदर लिखे गए env variables (MONGODB_CLUSTER_ADDRESS, MONGODB_USERNAME, MONGODB_PASSWORD, PORT: 8080) उसी कंप्यूटर के साथ खत्म हो जाते हैं। deploy job वाले नए कंप्यूटर को उनके बारे में कुछ नहीं पता होता।

# 2. क्या deploy job, Github Secrets (secrets.MONGODB_USERNAME) को access कर सकता है?
# हाँ, कर सकता है—लेकिन तभी जब आप उसे deploy job के अंदर भी लोड करें।
# Secrets आपके GitHub Repository की settings में सुरक्षित रखे होते हैं। workflow का कोई भी Job उन्हें मांग सकता है।
# लेकिन, कोई भी job उसे सीधा इस्तेमाल नहीं कर सकता जब तक आप उसे उस job के env: ब्लॉक में लोड न करें।
# चूंकि हमने deploy job में env.MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }} नहीं लिखा है, इसलिए deploy job में वह access नहीं होगा और खाली (empty) प्रिंट होगा।
