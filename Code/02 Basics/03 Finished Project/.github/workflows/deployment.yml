# The name of the workflow as it appears in the Actions tab of the GitHub repository
name: Deploy Project

# Defines the events that trigger this workflow.
# Triggers on any code push to the repository, as well as manually via workflow_dispatch.
on: [push, workflow_dispatch]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # The 'test' job: responsible for testing the project
  test:
    # Runs the job on a hosted Ubuntu virtual machine
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checks out the repository's code so the workflow steps can access it
      - name: Get code
        uses: actions/checkout@v3
      
      # Step 2: Sets up Node.js environment on the runner
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      # Step 3: Installs the project dependencies using a clean install (npm ci)
      - name: Install dependencies
        run: npm ci
      
      # Step 4: Runs the tests defined in the package.json scripts
      - name: Run tests
        run: npm test

  # The 'deploy' job: responsible for building and deploying the project
  deploy:
    # Specifies that this job requires the 'test' job to complete successfully first.
    # If the 'test' job fails, the 'deploy' job is skipped.
    needs: test
    # Runs this job on a separate hosted Ubuntu virtual machine
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checks out the code on the deployment runner
      - name: Get code
        uses: actions/checkout@v3
      
      # Step 2: Installs Node.js on the deployment runner
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      # Step 3: Installs the project dependencies
      - name: Install dependencies
        run: npm ci
      
      # Step 4: Builds the project (e.g., compile assets, bundle files)
      - name: Build project
        run: npm run build
      
      # Step 5: Simulates the deployment step
      - name: Deploy
        run: echo "Deploying ..."
