# The name of the workflow as it appears in the Actions tab of the GitHub repository
name: Deployment Exercise 1

# Defines the trigger for this workflow.
# Automatically triggers on any push event to the repository.
on: push

# A workflow run is made up of one or more jobs that run sequentially or in parallel
jobs:
  # The 'deploy' job: responsible for preparing, linting, testing, building, and deploying the code in a single job
  deploy:
    # Runs the job on a hosted Ubuntu virtual machine
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checks out the repository's code to the runner
      - name: Get code
        uses: actions/checkout@v3
        
      # Step 2: Installs the project dependencies using a clean install (npm ci)
      - name: Install dependencies
        run: npm ci
        
      # Step 3: Lints the source code to check for style/error issues
      - name: Lint
        run: npm run lint
        
      # Step 4: Runs the project's automated test suite
      - name: Test code
        run: npm run test
        
      # Step 5: Builds the project for production
      - name: Build code
        run: npm run build
        
      # Step 6: Simulates deploying the code
      - name: Deploy code
        run: echo "Deploying..."
