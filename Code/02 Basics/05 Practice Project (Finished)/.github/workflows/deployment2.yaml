# The name of the workflow as it appears in the Actions tab of the GitHub repository
name: Deployment Exercise 2

# Defines the trigger for this workflow.
# Automatically triggers on any push event to the repository.
on: push

# A workflow run is made up of one or more jobs that run sequentially or in parallel
jobs:
  # Job 1: Lints the codebase
  lint:
    # Runs on a hosted Ubuntu virtual machine
    runs-on: ubuntu-latest
    steps: 
      # Step 1: Checks out the repository code
      - name: Get code
        uses: actions/checkout@v3
        
      # Step 2: Installs the project dependencies
      - name: Install dependencies
        run: npm ci
        
      # Step 3: Lints the project code
      - name: Lint
        run: npm run lint

  # Job 2: Runs tests on the codebase
  test:
    # Specifies that the 'test' job depends on the successful completion of the 'lint' job.
    # If the lint job fails, the test job is skipped.
    needs: lint
    # Runs on a hosted Ubuntu virtual machine
    runs-on: ubuntu-latest
    steps: 
      # Step 1: Checks out the repository code
      - name: Get code
        uses: actions/checkout@v3
        
      # Step 2: Installs the project dependencies
      - name: Install dependencies
        run: npm ci
        
      # Step 3: Runs tests
      - name: Test code
        run: npm run test

  # Job 3: Builds and deploys the codebase
  deploy:
    # Specifies that the 'deploy' job depends on the successful completion of the 'test' job.
    # If the test job fails, the deploy job is skipped.
    needs: test
    # Runs on a hosted Ubuntu virtual machine
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checks out the repository code
      - name: Get code
        uses: actions/checkout@v3
        
      # Step 2: Installs the project dependencies
      - name: Install dependencies
        run: npm ci
        
      # Step 3: Builds the project
      - name: Build code
        run: npm run build
        
      # Step 4: Simulates code deployment
      - name: Deploy code
        run: echo "Deploying..."