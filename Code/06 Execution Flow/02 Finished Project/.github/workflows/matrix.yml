# The name of the workflow as it appears in the Actions tab of the GitHub repository
name: Matrix Demo

# Automatically runs this workflow when code is pushed to the repository
on: push

jobs:
  # Job: build
  build:
    # 'continue-on-error: true' at the job level ensures that if any matrix combination fails,
    # the overall workflow run is still marked as successful, and downstream dependent jobs would continue.
    continue-on-error: true
    
    # Defines the matrix build strategy to run combinations of jobs in parallel
    strategy:
      matrix:
        # Define arrays of values. GitHub Actions generates a job for every cross-product combination:
        # 3 (node-version) * 2 (operating-system) = 6 initial combinations.
        node-version: [12, 14, 16]
        operating-system: [ubuntu-latest, windows-latest]
        
        # 'include' allows adding specific combinations to the matrix without defining them in the main arrays
        include:
          # Adds a 7th combination: Node 18 running on ubuntu-latest
          - node-version: 18
            operating-system: ubuntu-latest
            
        # 'exclude' filters out specific combinations generated by the matrix arrays
        exclude:
          # Excludes Node 12 running on windows-latest.
          # Net combinations to run: 6 (initial) + 1 (included) - 1 (excluded) = 6 jobs total.
          - node-version: 12
            operating-system: windows-latest
            
    # Dynamically sets the operating system for each matrix job runner instance
    runs-on: ${{ matrix.operating-system }}
    
    steps:
      # Step 1: Checks out the repository's code to the runner
      - name: Get Code
        uses: actions/checkout@v3
        
      # Step 2: Installs Node.js version dynamically based on the current matrix iteration
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          
      # Step 3: Installs the project dependencies
      - name: Install Dependencies
        run: npm ci
        
      # Step 4: Builds the project
      - name: Build project
        run: npm run build