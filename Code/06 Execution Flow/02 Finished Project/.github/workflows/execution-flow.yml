name: Website Deployment

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses:
          actions/checkout@v3

          # ~/.npm vs node_modules ka funda:
      # 1. Pehle path: ~/.npm tha -> Isme sirf npm ka download cache save hota tha, project ka './node_modules' nahi.
      #    Nateeja: Cache hit hone ke BAAVJOOD har baar 'npm ci' chalana compulsory tha taaki node_modules ban sake.
      # 2. Ab path: node_modules hai -> Pura ready-made 'node_modules' folder hi directly cache aur restore ho jata hai!
      #    Fayda (Execution Flow): 'id: cache' se hum 'steps.cache.outputs.cache-hit' check karte hain.
      #    Agar cache mil gaya (HIT), to agla 'npm ci' step 100% SKIP ho jata hai -> har job me 15-30 second bachte hain!

      # Dependency Caching ka Evolution (Zero Cache -> ~/.npm -> node_modules):
      # 1. Bina Cache ke (Sabse slow 🐌):
      #    Har baar internet se saare packages naye sire se download karo + unpack karo (1-2 minute waste).
      # 2. Pehle path: ~/.npm tha (Kuch nahi se behtar 🚗):
      #    Isme packages ki zip/tarball files local disk pe save rehti thi.
      #    Fayda: Internet se dubara download nahi karna padta tha, bas local disk se unpack hota tha (time bachta tha).
      #    Limitation: Project ka './node_modules' folder nahi banta tha, isliye 'npm ci' chalana compulsory tha.
      # 3. Ab path: node_modules hai (Superfast ⚡):
      #    Pura ready-to-use 'node_modules' folder hi seedha restore ho jata hai!
      #    Fayda (Execution Flow): 'id: cache' se check kiya -> agar cache HIT hua, to 'npm ci' chalane ki
      #    zaroorat hi nahi, step 100% SKIP ho jayega -> 0 second overhead!
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint code
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test code
        id: run-tests
        run: npm run test
        # 4 upar test fail ho gaya but without failure() upload report generate nahi hua
        # aisa isliye hua ki jaha par bhi fail ho jaye waha par ruk jao and aage ka run mat karo to test fail hone ke baad execution yaha par hi ruk gaya
        # par jab hamne failure() lagaya to github ko malum hai ki niche wala step bhi mujhe execute karna hai if conditions met
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build website
        id: build-website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-files
      - name: Output contents
        run: ls
      - name: Deploy
        run: echo "Deploying..."

  report:
    # 1. needs: [lint, deploy] -> Poore workflow ko cover karne ka trick:
    # Pipeline me 2 branches hain:
    # - Branch 1: 'lint' (akela independent job)
    # - Branch 2: 'test' -> 'build' -> 'deploy' (chain job)
    # Yahan sirf 'lint' aur 'deploy' likhne se poora workflow cover ho gaya.
    # (Agar 'test' ya 'build' fail hoga, to 'deploy' skip hoga, matlab Branch 2 fail -> report trigger!)

    # 2. if: failure() -> Default behavior ko override karna:
    # By default agar pichla job fail ho jaye, to GitHub aage ke dependent jobs SKIP kar deta hai.
    # Lekin 'report' job ka kaam hi gadbad hone par alert/log dena hai!
    # Isliye 'if: failure()' lagaya taaki agar koi bhi job fail ho, tab ye zaroor chale.
    # (Aur agar sab pass ho gaya to ye job automatically SKIP ho jayega).
    needs: [lint, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "Something went wrong"
          echo "${{ toJSON(github) }}"
